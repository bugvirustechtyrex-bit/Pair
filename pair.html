<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TYREX_KSH TECH | PAIR CODE ULTRA</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700&family=Rajdhani:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --c1: #ff0000;
    --c2: #ff7700;
    --c3: #ffff00;
    --c4: #00ff00;
    --c5: #0000ff;
    --c6: #4b0082;
    --c7: #9400d3;
    --c8: #00ffff;
    --c9: #ff00ff;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 20% 30%, #0a0a1a, #030308);
    font-family: 'Poppins', 'Rajdhani', sans-serif;
    overflow-x: hidden;
    position: relative;
  }

  /* Animated Stars Background */
  .stars {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0;
    animation: twinkle 3s infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* Rainbow Wave Background */
  .rainbow-wave {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 30%;
    background: linear-gradient(90deg, 
      var(--c1), var(--c2), var(--c3), var(--c4), var(--c5), var(--c6), var(--c7), var(--c1));
    opacity: 0.08;
    filter: blur(40px);
    animation: waveMove 8s linear infinite;
    z-index: 0;
  }

  @keyframes waveMove {
    0% { transform: translateX(-20%); }
    100% { transform: translateX(20%); }
  }

  /* Glassmorphism Card */
  .ultra-card {
    position: relative;
    z-index: 10;
    max-width: 500px;
    margin: 5% auto;
    padding: 45px 40px;
    background: rgba(8, 12, 25, 0.6);
    backdrop-filter: blur(20px);
    border-radius: 60px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    animation: cardFloat 0.8s ease-out;
    transition: all 0.3s ease;
  }

  @keyframes cardFloat {
    0% { opacity: 0; transform: translateY(80px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Animated Border */
  .ultra-card::before {
    content: '';
    position: absolute;
    top: -2px;
    left: -2px;
    right: -2px;
    bottom: -2px;
    background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3), var(--c4), var(--c5), var(--c6), var(--c7), var(--c1));
    background-size: 200% 100%;
    border-radius: 62px;
    z-index: -1;
    animation: borderMove 3s linear infinite;
    opacity: 0.7;
  }

  @keyframes borderMove {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  /* Logo Section */
  .logo-ultra {
    text-align: center;
    margin-bottom: 25px;
  }

  .logo-ring {
    position: relative;
    width: 100px;
    height: 100px;
    margin: 0 auto 20px;
  }

  .ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 2px solid transparent;
  }

  .ring1 {
    border-top-color: var(--c1);
    border-right-color: var(--c2);
    animation: spin 6s linear infinite;
  }

  .ring2 {
    width: 80%;
    height: 80%;
    top: 10%;
    left: 10%;
    border-bottom-color: var(--c3);
    border-left-color: var(--c4);
    animation: spinReverse 4s linear infinite;
  }

  .ring3 {
    width: 60%;
    height: 60%;
    top: 20%;
    left: 20%;
    border-top-color: var(--c5);
    border-right-color: var(--c6);
    animation: spin 3s linear infinite;
  }

  @keyframes spin {
    100% { transform: rotate(360deg); }
  }

  @keyframes spinReverse {
    100% { transform: rotate(-360deg); }
  }

  .logo-icon {
    position: absolute;
    width: 50%;
    height: 50%;
    top: 25%;
    left: 25%;
    background: url('https://i.ibb.co/0przShNX/Tyrex-Ksh-Tech.jpg') center/cover no-repeat;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.2);
  }

  /* Title */
  .title-area {
    text-align: center;
    margin-bottom: 30px;
  }

  .main-title {
    font-size: 2.2rem;
    font-weight: 800;
    font-family: 'Orbitron', monospace;
    background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3), var(--c4), var(--c5), var(--c6), var(--c7));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: textFlow 3s linear infinite;
    letter-spacing: 2px;
  }

  @keyframes textFlow {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }

  .subtitle {
    font-size: 0.7rem;
    letter-spacing: 5px;
    color: #888;
    text-transform: uppercase;
    margin-top: 8px;
  }

  /* Language Switch */
  .lang-container {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 30px;
  }

  .lang-pill {
    padding: 8px 24px;
    border-radius: 40px;
    background: rgba(20, 25, 45, 0.8);
    border: 1px solid rgba(0, 255, 136, 0.3);
    color: #aaa;
    font-weight: 600;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .lang-pill.active {
    background: linear-gradient(135deg, var(--c1), var(--c2), var(--c3));
    color: #000;
    border-color: transparent;
    box-shadow: 0 0 20px rgba(255, 255, 0, 0.5);
  }

  /* Input Section */
  .input-section {
    margin-bottom: 25px;
  }

  .input-label {
    font-size: 0.75rem;
    color: #888;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }

  .input-wrapper {
    display: flex;
    gap: 12px;
  }

  .cyber-input {
    flex: 1;
    padding: 16px 20px;
    background: rgba(2, 8, 20, 0.9);
    border: 1px solid rgba(0, 255, 136, 0.3);
    border-radius: 40px;
    color: #00ff88;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    transition: all 0.3s ease;
  }

  .cyber-input:focus {
    outline: none;
    border-color: var(--c7);
    box-shadow: 0 0 20px rgba(148, 0, 211, 0.3);
  }

  .action-btn {
    padding: 16px 28px;
    background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3), var(--c4), var(--c5), var(--c6), var(--c7));
    background-size: 200% auto;
    border: none;
    border-radius: 40px;
    color: #000;
    font-weight: 700;
    font-family: 'Orbitron', monospace;
    cursor: pointer;
    transition: all 0.3s ease;
    animation: btnFlow 3s linear infinite;
  }

  @keyframes btnFlow {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }

  .action-btn:hover {
    transform: scale(1.02);
    box-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
  }

  /* Response Card */
  .response-card {
    display: none;
    background: rgba(1, 6, 20, 0.8);
    border-radius: 30px;
    padding: 20px;
    margin-top: 20px;
    border: 1px solid rgba(0, 255, 136, 0.2);
    animation: glowPulse 2s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 5px rgba(0, 255, 136, 0.2); }
    50% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }
  }

  .response-header {
    font-size: 0.7rem;
    color: #00ff88;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }

  .code-box {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.3rem;
    font-weight: 700;
    background: linear-gradient(90deg, var(--c4), var(--c8), var(--c9));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    word-break: break-all;
    padding: 10px 0;
  }

  .copy-action {
    width: 100%;
    margin-top: 15px;
    padding: 12px;
    background: linear-gradient(90deg, var(--c4), var(--c8));
    border: none;
    border-radius: 30px;
    color: #000;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .copy-action:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
  }

  /* Stats Row */
  .stats-row {
    display: flex;
    justify-content: space-between;
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }

  .stat {
    text-align: center;
    flex: 1;
  }

  .stat-value {
    font-size: 1rem;
    font-weight: 700;
    font-family: 'Orbitron', monospace;
    background: linear-gradient(90deg, var(--c4), var(--c8));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .stat-label {
    font-size: 0.6rem;
    color: #666;
    margin-top: 4px;
  }

  /* Floating Elements */
  .float-wa {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background: linear-gradient(135deg, #25d366, #00ff88);
    padding: 12px 22px;
    border-radius: 50px;
    color: #000;
    font-weight: 700;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Orbitron', monospace;
    box-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
    animation: bounce 2s ease-in-out infinite;
    z-index: 20;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .controls {
    position: fixed;
    bottom: 25px;
    left: 25px;
    display: flex;
    gap: 12px;
    z-index: 20;
  }

  .ctrl {
    padding: 10px 18px;
    background: rgba(2, 8, 20, 0.8);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(0, 255, 136, 0.3);
    border-radius: 40px;
    color: #00ff88;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .ctrl:hover {
    border-color: var(--c7);
    box-shadow: 0 0 15px rgba(148, 0, 211, 0.3);
  }

  .footer {
    position: fixed;
    bottom: 12px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.6rem;
    color: rgba(255, 255, 255, 0.3);
    font-family: 'JetBrains Mono', monospace;
    z-index: 20;
  }

  audio { display: none; }

  @media (max-width: 550px) {
    .ultra-card {
      margin: 10% 20px;
      padding: 35px 25px;
    }
    .input-wrapper {
      flex-direction: column;
    }
    .main-title {
      font-size: 1.5rem;
    }
    .stats-row {
      flex-wrap: wrap;
      gap: 15px;
    }
    .float-wa {
      padding: 8px 16px;
      font-size: 0.7rem;
    }
    .controls {
      bottom: 80px;
    }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="rainbow-wave"></div>

<div class="ultra-card">
  <!-- Logo -->
  <div class="logo-ultra">
    <div class="logo-ring">
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div class="ring ring3"></div>
      <div class="logo-icon"></div>
    </div>
  </div>

  <!-- Title -->
  <div class="title-area">
    <h1 class="main-title">TYREX_KSH TECH</h1>
    <div class="subtitle">BASE24 • PAIR CODE SYSTEM</div>
  </div>

  <!-- Language Switch -->
  <div class="lang-container">
    <div class="lang-pill active" id="lang-en">🇬🇧 ENGLISH</div>
    <div class="lang-pill" id="lang-sw">🇹🇿 KISWAHILI</div>
  </div>

  <!-- Input Section -->
  <div class="input-section">
    <div class="input-label" id="input-label">📱 WHATSAPP NUMBER</div>
    <div class="input-wrapper">
      <input type="text" id="phone-number" class="cyber-input" placeholder="255XXXXXXXXX" autocomplete="off">
      <button class="action-btn" id="generate-btn">✨ GENERATE</button>
    </div>
  </div>

  <!-- Response Card -->
  <div class="response-card" id="response-card">
    <div class="response-header" id="response-header">🔐 PAIR CODE GENERATED</div>
    <div class="code-box" id="code-box">XXXX-XXXX-XXXX</div>
    <button class="copy-action" id="copy-btn">📋 COPY TO CLIPBOARD</button>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat">
      <div class="stat-value">BASE24</div>
      <div class="stat-label">ENCRYPTION</div>
    </div>
    <div class="stat">
      <div class="stat-value">24/7</div>
      <div class="stat-label">UPTIME</div>
    </div>
    <div class="stat">
      <div class="stat-value">AUTO</div>
      <div class="stat-label">FOLLOW</div>
    </div>
    <div class="stat">
      <div class="stat-value">v6.0</div>
      <div class="stat-label">ULTRA</div>
    </div>
  </div>
</div>

<!-- Floating Elements -->
<a class="float-wa" href="https://wa.me/255628378557" target="_blank">
  <i class="fab fa-whatsapp"></i> CONTACT OWNER
</a>

<div class="controls">
  <button class="ctrl" id="toggle-music">🎵 MUSIC ON</button>
  <button class="ctrl" id="toggle-effects">✨ EFFECTS ON</button>
</div>

<div class="footer">
  ⚡ TYREX_KSH TECH | © 2025-2026 | SECURE PAIRING SYSTEM
</div>

<audio id="bgm" src="https://files.catbox.moe/iwpfp2.mp3" loop></audio>

<script>
  // ========== PARTICLES / STARS ==========
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 150; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.width = Math.random() * 3 + 1 + 'px';
    star.style.height = star.style.width;
    star.style.animationDelay = Math.random() * 5 + 's';
    star.style.animationDuration = Math.random() * 3 + 2 + 's';
    starsContainer.appendChild(star);
  }

  // ========== LANGUAGE DATA ==========
  const texts = {
    en: {
      label: "📱 WHATSAPP NUMBER",
      placeholder: "255XXXXXXXXX",
      button: "✨ GENERATE",
      generating: "⏳ Generating secure pairing code...",
      success: "🔐 PAIR CODE GENERATED",
      invalid: "❌ Invalid WhatsApp number!",
      error: "❌ Connection error. Please try again.",
      copy: "📋 COPY TO CLIPBOARD",
      copied: "✅ COPIED!"
    },
    sw: {
      label: "📱 NAMBA YA WHATSAPP",
      placeholder: "255XXXXXXXXX",
      button: "✨ ZAALISHA",
      generating: "⏳ Inazalisha code pairing...",
      success: "🔐 CODE PAIRING IMETENGENEZWA",
      invalid: "❌ Namba ya WhatsApp si sahihi!",
      error: "❌ Hitilafu ya mtandao. Jaribu tena.",
      copy: "📋 NAKILI KWENYE CLIPBOARD",
      copied: "✅ IMENAKILIWA!"
    }
  };

  let currentLang = "en";

  const inputLabel = document.getElementById("input-label");
  const phoneInput = document.getElementById("phone-number");
  const generateBtn = document.getElementById("generate-btn");
  const responseCard = document.getElementById("response-card");
  const responseHeader = document.getElementById("response-header");
  const codeBox = document.getElementById("code-box");
  const copyBtn = document.getElementById("copy-btn");

  const langEn = document.getElementById("lang-en");
  const langSw = document.getElementById("lang-sw");

  function updateLanguage() {
    inputLabel.textContent = texts[currentLang].label;
    phoneInput.placeholder = texts[currentLang].placeholder;
    generateBtn.textContent = texts[currentLang].button;
    langEn.classList.toggle("active", currentLang === "en");
    langSw.classList.toggle("active", currentLang === "sw");
  }

  langEn.onclick = () => {
    currentLang = "en";
    updateLanguage();
  };

  langSw.onclick = () => {
    currentLang = "sw";
    updateLanguage();
  };

  updateLanguage();

  // ========== VALIDATE NUMBER ==========
  function validateNumber(num) {
    let clean = num.replace(/\D/g, "");
    if (clean.length === 9) clean = "255" + clean;
    else if (clean.startsWith("0")) clean = "255" + clean.slice(1);
    else if (clean.length === 12 && clean.startsWith("255")) {}
    else if (clean.length === 10 && !clean.startsWith("255")) clean = "255" + clean;
    else if (clean.length === 13 && clean.startsWith("255")) {}
    else return null;
    
    if (clean.length !== 12 || !clean.startsWith("255")) return null;
    return clean;
  }

  // ========== GENERATE PAIR CODE ==========
  generateBtn.onclick = async () => {
    const rawNumber = phoneInput.value.trim();
    if (!rawNumber) {
      responseCard.style.display = "block";
      responseHeader.textContent = texts[currentLang].invalid;
      codeBox.textContent = "⚠️ ERROR";
      copyBtn.style.display = "none";
      return;
    }

    const validNumber = validateNumber(rawNumber);
    if (!validNumber) {
      responseCard.style.display = "block";
      responseHeader.textContent = texts[currentLang].invalid;
      codeBox.textContent = "⚠️ ERROR";
      copyBtn.style.display = "none";
      return;
    }

    responseCard.style.display = "block";
    responseHeader.textContent = texts[currentLang].generating;
    codeBox.textContent = "⏳ ━━━━━━━━━━━━━";
    copyBtn.style.display = "none";

    try {
      const res = await fetch(`/code?number=${validNumber}`);
      const data = await res.json();
      const pairCode = data.code || null;

      if (!pairCode || pairCode === "Unavailable") {
        throw new Error("No code received");
      }

      responseHeader.textContent = texts[currentLang].success;
      codeBox.textContent = pairCode;
      copyBtn.style.display = "block";
      copyBtn.textContent = texts[currentLang].copy;

      copyBtn.onclick = () => {
        navigator.clipboard.writeText(pairCode);
        copyBtn.textContent = texts[currentLang].copied;
        setTimeout(() => {
          copyBtn.textContent = texts[currentLang].copy;
        }, 2000);
      };

    } catch (err) {
      responseHeader.textContent = texts[currentLang].error;
      codeBox.textContent = "❌ CONNECTION FAILED";
      copyBtn.style.display = "none";
    }
  };

  phoneInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") generateBtn.click();
  });

  // ========== MUSIC CONTROL ==========
  const bgm = document.getElementById("bgm");
  let musicPlaying = false;

  document.addEventListener("click", () => {
    if (!musicPlaying && bgm.paused) {
      bgm.play().catch(() => {});
      musicPlaying = true;
      document.getElementById("toggle-music").textContent = "🎵 MUSIC ON";
    }
  }, { once: true });

  document.getElementById("toggle-music").onclick = () => {
    if (bgm.paused) {
      bgm.play();
      document.getElementById("toggle-music").textContent = "🎵 MUSIC ON";
    } else {
      bgm.pause();
      document.getElementById("toggle-music").textContent = "🔇 MUSIC OFF";
    }
  };

  // ========== EFFECTS TOGGLE ==========
  let effectsOn = true;
  const wave = document.querySelector('.rainbow-wave');
  const stars = document.getElementById('stars');

  document.getElementById("toggle-effects").onclick = () => {
    effectsOn = !effectsOn;
    wave.style.opacity = effectsOn ? "0.08" : "0";
    stars.style.opacity = effectsOn ? "1" : "0.2";
    document.getElementById("toggle-effects").innerHTML = effectsOn ? "✨ EFFECTS ON" : "💤 EFFECTS OFF";
  };

  // ========== 3D TILT ==========
  const card = document.querySelector('.ultra-card');
  let cardBounds = card.getBoundingClientRect();

  function updateBounds() {
    cardBounds = card.getBoundingClientRect();
  }

  window.addEventListener('resize', updateBounds);
  updateBounds();

  document.addEventListener('mousemove', (e) => {
    const mouseX = (e.clientX - cardBounds.left) / cardBounds.width;
    const mouseY = (e.clientY - cardBounds.top) / cardBounds.height;
    const rotateY = (mouseX - 0.5) * 10;
    const rotateX = (mouseY - 0.5) * 10;
    
    card.style.transform = `
      perspective(1000px)
      rotateX(${-rotateX}deg)
      rotateY(${rotateY}deg)
      translateY(0)
    `;
  });

  document.addEventListener('mouseleave', () => {
    card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)';
  });
</script>
</body>
</html>
